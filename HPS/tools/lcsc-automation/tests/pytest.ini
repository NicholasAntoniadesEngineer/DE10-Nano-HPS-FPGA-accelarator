[pytest]
# Pytest configuration for LCSC automation framework tests

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
    -ra
markers =
    unit: Unit tests for individual modules
    integration: Integration tests for full pipeline
    slow: Slow tests (>1s execution)
    requires_network: Tests requiring network access
    requires_files: Tests requiring external files
